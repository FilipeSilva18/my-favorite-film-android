name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
  GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

jobs:
  checks:
    name: Architecture, JVM tests, screenshots, lint and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Documentation and agent skills
        run: python3 scripts/check-docs.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: google-services.json (Firebase)
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Module graph rules
        run: ./gradlew assertModuleGraph

      - name: Architecture tests (Konsist)
        run: ./gradlew :architecture-test:unitTest

      - name: Unit, integration and JVM UI tests (Robolectric)
        run: ./gradlew unitTest

      - name: Screenshot tests (Roborazzi)
        if: ${{ hashFiles('**/src/test/screenshots/*.png') != '' }}
        run: ./gradlew verifyRoborazziDebug

      - name: Lint
        run: ./gradlew lintDebug

      - name: Coverage (Kover)
        run: ./gradlew koverXmlReport koverHtmlReport

      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-debug.html
            **/build/outputs/roborazzi/
            build/reports/kover/

  instrumented:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: google-services.json (Firebase)
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Enable KVM (emulator acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: connectedDebugAndroidTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: '**/build/reports/androidTests/'
